name: Build & Deploy Hugo

on:
  push:
    branches:
      - main
      - preview
  schedule:
    # 08:00 and 14:00 Asia/Shanghai (00:00 and 06:00 UTC).
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  prepare:
    name: Refresh site data
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh blog and gate scheduled runs
        id: gate
        run: |
          npm run gen:blog
          if [[ "${{ github.event_name }}" == "schedule" ]] && git diff --quiet -- site.json site.cn.json; then
            echo "Scheduled run with no content changes; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload prepared site data
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: |
            site.json
            site.cn.json
          retention-days: 1

  build-com:
    name: Build Hugo → com branch
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.FLYBAY_DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pinned submodules via SSH
        run: git submodule update --init --recursive

      - uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.163.3"
          extended: true

      - uses: actions/download-artifact@v4
        with:
          name: site-data

      - name: Build com site
        run: |
          node scripts/prepare-hugo-data.mjs com
          hugo --minify --gc --baseURL https://debuginn.com/ --destination dist

      - name: Deploy to com branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: com
          publish_dir: ./dist
          force_orphan: true

  build-cn:
    name: Build Hugo → cn branch
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.FLYBAY_DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pinned submodules via SSH
        run: git submodule update --init --recursive

      - uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.163.3"
          extended: true

      - uses: actions/download-artifact@v4
        with:
          name: site-data

      - name: Build cn site
        run: |
          node scripts/prepare-hugo-data.mjs cn
          hugo --minify --gc --baseURL https://debuginn.cn/ --destination dist

      - name: Deploy to cn branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: cn
          publish_dir: ./dist
          force_orphan: true
